<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<meta name="description" content="{{ site.description }}">
<meta name="author" content="{{ site.author_name }}">
<meta name="github" content="{{ site.github_username }}">

<title>{{site.title}} | {{page.title}}</title>

<!--<link href="https://fonts.googleapis.com/css?family=Playfair+Display" rel="stylesheet">--> 

<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

<script src="//static.tumblr.com/ihhnoee/12Cotb0p2/jquery.style-my-tooltips.js"></script>

<script>
  (function($){
    $(document).ready(function(){
      $("a[title]").style_my_tooltips({
        tip_follows_cursor:false,
        tip_delay_time:100,
        tip_fade_speed:300,
        attribute:"title"
      });
    });
  })(jQuery);
</script>

<link href="cssreset.css" rel="stylesheet">
<link href="/mid-2019/index.css" rel="stylesheet">
<link rel="shortcut icon" type="image/x-icon" href="{{ site.image }}">

</head>
  
<body style="margin-top:34px!important;">
  
<div style="position:fixed; top:0; width:100%; background:rgba(244, 236, 230,1); padding:10px 5px; z-index:10000000000; text-align:center;"><a href="/" target="_blank" style="color:#4C785D!important;text-decoration:none!important;cursor:pointer!important;font-family: sans-serif !important;font-size: 16px;">Visit my newest portfolio ➞</a></div>
  
  <div id="mobile-header">

    <div id="drop-header">
      <div class="dropdown">
        <span><i class="fas fa-chevron-down"></i></span>
        <div class="dropdown-content">
          <ul>
          {% include mainmenu.html %}
          </ul>
        </div>
      </div> 
    </div>


    <div id="top-menu-right">
      <ul>
        {% include socials.html %}
        <!-- <li><a href="/es/" title="Español"><i class="fa fa-globe"></i>
        </a></li> -->
      </ul>
    </div>

  </div>

  <div id="header">
    <div id="top-menu-left">
      <ul>
        <li>
          <img src="/img/pfp.png" class="img-fluid menulogo">
        </li>
      {% include mainmenu.html %}
      </ul>      
    </div>
    <div id="top-menu-right">
      <ul>
        {% include socials.html %}
        <!-- <li><a href="/es/" title="Español"><i class="fa fa-globe"></i>
        </a></li> -->
      </ul>
    </div>
  </div>



  <div class="container-fluid">
    <div id="main-area">
      <div id="content">

        {% include post-header.html %}
        {{content}}

      </div>
      
    </div>
  </div>
  <div id="footer">
    <div id="footer-widgets">

      {% include credits.html %}
      
    </div>

  </div>


</body>
</html>
